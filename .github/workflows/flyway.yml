# Flyway sandbox pipeline (GitHub Actions, self-hosted Windows runner)
#
# Pull request that changes migrations/:
#   rebuild the Build database from the baseline and every migration, then code review
#   and a change report against Test. Nothing is deployed.
# Push to main that changes migrations/ (or Run workflow):
#   the same, then report and deploy to Test, then Prod.
#
# Database connections come from flyway.toml, so there is nothing to edit here. One-time setup:
#   1. A self-hosted Windows runner on a machine that can reach your database server
#      (Settings > Actions > Runners). With Windows sign-in, the runner's service account
#      needs access to the databases.
#   2. Repository secrets (Settings > Secrets and variables > Actions):
#        FLYWAY_EMAIL, FLYWAY_TOKEN  your Redgate account email and a personal access token:
#        https://documentation.red-gate.com/flyway/flyway-cli-and-api/tutorials/tutorial-personal-access-tokens
#        DB_USERNAME, DB_PASSWORD    only if you use a SQL login
#   3. Environments "test" and "prod" (Settings > Environments). Add required reviewers
#      to "prod" so the pipeline waits for approval before Prod.

name: Flyway

on:
  pull_request:
    paths: [ 'migrations/**' ]
  push:
    branches: [ main ]
    paths: [ 'migrations/**' ]
  workflow_dispatch:

env:
  FLYWAY_EMAIL: ${{ secrets.FLYWAY_EMAIL }}
  FLYWAY_TOKEN: ${{ secrets.FLYWAY_TOKEN }}
  DB_USERNAME: ${{ secrets.DB_USERNAME }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  FLYWAY_INSTALL_DIRECTORY: C:\FlywayCLI

defaults:
  run:
    shell: powershell

jobs:
  build:
    name: Build and review
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install Flyway CLI (skipped if already installed)
        run: |
          & .\Scripts\Flyway_DownloadAndInstallCLI.ps1
          $env:FLYWAY_INSTALL_DIRECTORY | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Rebuild Build from the baseline and all migrations
        run: |
          .\Scripts\flyway-ci.ps1 clean -environment=Build -cleanDisabled=false
          .\Scripts\flyway-ci.ps1 info migrate info -environment=Build
      - name: Code review and change report against Test
        run: .\Scripts\flyway-ci.ps1 check -code -changes -dryrun -environment=Test "-reportFilename=reports/Build-check.html"
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: reports/
          if-no-files-found: ignore

  test:
    name: Deploy to Test
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: self-hosted
    environment: test
    steps:
      - uses: actions/checkout@v4
      - name: Install Flyway CLI (skipped if already installed)
        run: |
          & .\Scripts\Flyway_DownloadAndInstallCLI.ps1
          $env:FLYWAY_INSTALL_DIRECTORY | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Pre-deployment report (changes, drift, SQL to run)
        run: .\Scripts\flyway-ci.ps1 check -changes -drift -dryrun -environment=Test "-reportFilename=reports/Test-check.html"
      - name: Deploy
        run: .\Scripts\flyway-ci.ps1 info migrate info -environment=Test "-migrate.saveSnapshot=true"
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: ignore

  prod:
    name: Deploy to Prod (sandbox)
    needs: test
    runs-on: self-hosted
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - name: Install Flyway CLI (skipped if already installed)
        run: |
          & .\Scripts\Flyway_DownloadAndInstallCLI.ps1
          $env:FLYWAY_INSTALL_DIRECTORY | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Pre-deployment report (changes, drift, SQL to run)
        run: .\Scripts\flyway-ci.ps1 check -changes -drift -dryrun -environment=Prod "-reportFilename=reports/Prod-check.html"
      - name: Deploy
        run: .\Scripts\flyway-ci.ps1 info migrate info -environment=Prod "-migrate.saveSnapshot=true"
      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-reports
          path: reports/
          if-no-files-found: ignore
